# Type
type: "FCNN"
# training
epochs: null
full_dataset_gradient: [false, true] # Trial minibatches or one accumulated gradient over the full dataset.
number_of_updates: 60000 # Rounded up to whole epochs for the selected batch size.
full_dataset_number_of_updates: 2000 # Override when full_dataset_gradient is true.
batch_size: [1024, 32768]
early_stopping: true
patience: 3
tolerance: 0.02
wait_till: 5
learning_rate: [0.00005, 0.005]
optimizer_name: "AdamW"
lr_scheduler_name: "CosineDecayWithWarmUp"
lr_scheduler_options:
  alpha: 0.000005
  warmup_fraction: 0.1
  step_power: [0.1, 1.0]
gradient_clipping_norm: null
# architecture
dropout: [0.0, 0.03]
dense_layers:
  layer_1: [32, 256]
  layer_2: [32, 256]
  layer_3: [32, 256]
activation: ["relu", "elu"]
log_l2_lambda: [-7.0, -5.0]
normalise_batch_categories: false
