# Type
type: "FCNN"
# training
epochs: null
number_of_updates: 60000 # Approximately the AbsoluteMPFBias 2223 training; rounded up to whole epochs.
full_dataset_number_of_updates: 2000 # Override when full_dataset_gradient is true.
batch_size: 2048
early_stopping: True
learning_rate: 0.001
optimizer_name: "AdamW"
lr_scheduler_name: "CosineDecayWithWarmUp"
lr_scheduler_options:
  alpha: 0.000005
  warmup_fraction: 0.1
  step_power: 0.5
gradient_clipping_norm: null
# architecture
dropout: 0.02
dense_layers:
  layer_1: 64
  layer_2: 64
activation: relu
l2_lambda: 0.0001
log_l2_lambda: null # When set, use 10**log_l2_lambda instead of l2_lambda.
normalise_batch_categories: false
