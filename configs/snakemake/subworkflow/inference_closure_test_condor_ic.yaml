# Get validation results
- step: "InitialFit"
  submit: "configs/submit/condor_gpu_long.yaml"
  run_options: 
    data_type: "sim"
    extra_dir_name: "ClosureTest"
    prune_classifier_models: "roc_auc_test:0.505"
    integrate_density_with_ratios: True
    classifier_divide_by_nominal: True
- step: "HessianNumerical"
  submit: "configs/submit/condor_gpu_long.yaml"
  run_options: 
    data_type: "sim"
    extra_dir_name: "ClosureTest"
    prune_classifier_models: "roc_auc_test:0.505"
    integrate_density_with_ratios: True
    classifier_divide_by_nominal: True
- step: "DMatrixNumerical"
  submit: "configs/submit/condor_gpu_long.yaml"
  run_options: 
    data_type: "sim"
    extra_dir_name: "ClosureTest"
    prune_classifier_models: "roc_auc_test:0.505"
    integrate_density_with_ratios: True
    classifier_divide_by_nominal: True
- step: "CovarianceWithDMatrix"
  submit: "configs/submit/condor_avx.yaml"
  run_options: 
    data_type: "sim"
    extra_dir_name: "ClosureTest"
    prune_classifier_models: "roc_auc_test:0.505"
    integrate_density_with_ratios: True
    classifier_divide_by_nominal: True

# Get full summary
- step: "Summary"
  submit: "configs/submit/condor_avx.yaml"
  run_options: 
    extra_dir_name: "ClosureTest"
    summary_from: "CovarianceWithDMatrix"
    summary_nominal_name: "Closure Test"
    summary_show_2sigma: True
    summary_subtract: True
    loop_over_nuisances: True
    loop_over_rates: True
    loop_over_lnN: True
    loop_over_only_val_parameters: True

# Get summary per val
- step: "SummaryPerVal"
  submit: "configs/submit/condor_avx.yaml"
  run_options: 
    summary_from: "CovarianceWithDMatrix"
    extra_dir_name: "ClosureTest"
    summary_nominal_name: "Closure Test"
    summary_show_2sigma: True
    loop_over_rates: True
    loop_over_lnN: True
    loop_over_only_val_parameters: True