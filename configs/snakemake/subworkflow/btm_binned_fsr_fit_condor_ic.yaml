# Observed-data FSR fit, uncertainties, profiled scans and post-fit distributions.
# The parent workflow supplies category selections and optional era suffixes.
- step: InitialFit
  submit: configs/submit/condor_avx.yaml
  run_options:
    specific_combined_default_val: true
    data_type: data
    likelihood_type: binned_extended
    minimisation_method: minuit

- step: HessianNumerical
  submit: configs/submit/condor_avx.yaml
  run_options:
    specific_combined_default_val: true
    data_type: data
    likelihood_type: binned_extended

- step: Covariance
  submit: configs/submit/condor_avx.yaml
  run_options:
    specific_combined_default_val: true
    data_type: data
    likelihood_type: binned_extended

- step: ScanPointsFromHessian
  submit: configs/submit/condor_avx.yaml
  run_options:
    specific_combined_default_val: true
    data_type: data
    likelihood_type: binned_extended
    loop_over_nuisances: true

- step: Scan
  submit: configs/submit/condor_2_cpus_avx.yaml
  run_options:
    specific_combined_default_val: true
    data_type: data
    likelihood_type: binned_extended
    loop_over_nuisances: true
    minimisation_method: minuit

- step: ScanCollect
  submit: configs/submit/condor_avx.yaml
  run_options:
    specific_combined_default_val: true
    data_type: data
    likelihood_type: binned_extended
    loop_over_nuisances: true

- step: ScanPlot
  submit: configs/submit/condor.yaml
  run_options:
    specific_combined_default_val: true
    data_type: data
    likelihood_type: binned_extended
    loop_over_nuisances: true

- step: DistributionPlot
  submit: configs/submit/condor.yaml
  run_options:
    extra_output_dir_name: PostFit
    ratio_range: 0.5,1.5
    sim_type: full
    data_type: data
    likelihood_type: binned_extended
